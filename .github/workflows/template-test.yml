name: Test (reusable)

# Reusable test job. Called by publish-to-pypi.yml as the release gate; safe to
# call from a PR/push workflow too, if general CI is ever added.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string

permissions: {}

jobs:
  test:
    name: ${{ inputs.os }} / py${{ inputs.python-version }}
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      # nmd itself has no dependencies; these are what the *test suite* needs in
      # order to reach the optional modules (V7, nmd_bow, nmd_segments, WordSet).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy pyroaring regex

      - name: Run the suite
        run: pytest -q
