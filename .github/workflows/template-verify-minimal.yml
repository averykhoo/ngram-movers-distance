name: Verify the dependency-free install (reusable)

# The standing constraint (HANDOFF, 2026-09-05): `import nmd` pulls in nothing
# third-party. Checked against the BUILT WHEEL rather than the source tree, so
# it also catches pyproject.toml accidentally growing a dependency.
#
# Extracted from publish-to-pypi.yml on 2026-09-18, when ci.yml started running
# it on every push to master. It is deliberately ONE copy called from two
# workflows: a second, stale copy of this check is worse than no copy at all,
# because it is the one that fails by passing.
#
# ubuntu-only on purpose -- the venv layout used below (/tmp/bare/bin/...) is
# posix, and this checks a pure-python wheel, where the OS is not the variable
# that matters.

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.10" # the declared floor, per pyproject.toml

permissions: { }

jobs:
  verify-minimal:
    name: bare install / py${{ inputs.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Install it alone, with none of the optional packages
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install dist/*.whl
          /tmp/bare/bin/python - <<'PY'
          import importlib.util
          import sys

          optional = ('numpy', 'scipy', 'pyroaring', 'regex', 'numba')

          # Fail loudly if the environment is not actually bare -- otherwise this
          # whole job passes vacuously, which is worse than not having it.
          for mod in optional:
              assert importlib.util.find_spec(mod) is None, \
                  f'{mod} is installed; this check would pass for the wrong reason'

          import nmd
          from nmd import ngram_movers_distance, WordList

          leaked = [m for m in optional if m in sys.modules]
          assert not leaked, f'importing nmd pulled in {leaked}'

          assert nmd.__all__ == ('ngram_movers_distance', 'WordList'), nmd.__all__

          assert 0.0 <= ngram_movers_distance('hello', 'yellow', normalize=True) <= 1.0
          wl = WordList()
          for w in ('hello', 'yellow', 'help', 'mellow'):
              wl.add_word(w)
          assert wl.lookup('helo'), 'WordList returned nothing'

          print('dependency-free install OK; nmd', nmd.__version__)
          PY
